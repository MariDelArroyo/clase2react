name: Hola Mundo
on:
  push:
  workflow_dispatch:
jobs:
  hola:
    runs-on: ubuntu-latest
    steps:
    - name: saludar
      run: echo "Hola Mundo"
    - name: Descargar Codigo
      uses: actions/checkout@v4
    - name: En que carpeta estoy
      run: pwd
    - name: Listado de archivos
      run: ls -la
    - name: Descargar node
      run: actions/setup-node@v4