name: serpiente

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pages: write

jobs:
  serpiente:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: Instalar node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        working-directory: serpientePorTurnos/serpienteporturnos
        run: npm i

      - name: Compilar el proyecto
        working-directory: serpientePorTurnos/serpienteporturnos
        run: npx vite build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Guardar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: serpientePorTurnos/serpienteporturnos/dist

      - name: Publicar
        uses: actions/deploy-pages@v4