name: Contador
on:
  push:
  workflow_dispatch:
jobs:
  hola:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4
      - name: Instalar node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependencias
        working-directory: clase18/contador
        run: npm i

      - name: Compilar el proyecto
        working-directory: clase18/contador
        run: npx vite build
      
      - name: Guardar Zip
        uses: actions/upload-artifact@v4
        with:
          name: contador
          path: clase18/contador/dist